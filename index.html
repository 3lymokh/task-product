<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products</title>
  <link rel="stylesheet" href="bootstrap.css">
</head>
<body class="p-4 text-center">

  <button id="btn" class="btn btn-primary mb-4">Click to Show Products</button>

  <div id="container" class="row row-cols-1 row-cols-md-4 g-3 text-start"></div>

  <template id="template">
    <div class="col">
      <div class="card h-100 p-2 shadow-sm">
        <img class="card-img-top" style="height: 150px; object-fit: contain;">
        <div class="card-body">
          <h6 class="text-truncate"></h6>
          <p class="small text-muted text-truncate"></p>
          <div class="d-flex justify-content-between">
            <b class="text-primary"></b>
            <span class="badge bg-warning text-dark"></span>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
